<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>Arsin Print Server - make any printer wireless from the browser</title>
<meta name="description" content="Install Arsin Print Server firmware on ESP32, ESP8266 or Raspberry Pi straight from your browser: Wi-Fi, Bluetooth and USB-host print bridges with a full web control panel, label designer and maintenance console.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Crect x='8' y='6' width='16' height='8' rx='2' fill='white'/%3E%3Crect x='6' y='14' width='20' height='9' rx='2' fill='white'/%3E%3Crect x='11' y='21' width='10' height='6' rx='1' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div id="app-header"></div>

<main class="wrap">
  <section class="hero">
    <span class="eyebrow">arsin_print_server &middot; ESP32 / ESP8266 / Raspberry Pi</span>
    <h1 data-i18n="app.hero.title">Make any printer wireless - from the browser</h1>
    <p class="lead" data-i18n="app.hero.lead"></p>
    <div class="row mt2">
      <a class="btn primary" href="install.html" data-i18n="nav.install"></a>
      <a class="btn" href="designer.html" data-i18n="nav.designer"></a>
      <a class="btn ghost" href="troubleshoot.html" data-i18n="nav.troubleshoot"></a>
    </div>
    <div class="grid cols-4 mt3">
      <div class="card pad-sm"><strong id="stat-boards">-</strong><div class="small" data-i18n="home.stat.boards"></div></div>
      <div class="card pad-sm"><strong id="stat-apps">-</strong><div class="small" data-i18n="home.stat.apps"></div></div>
      <div class="card pad-sm"><strong id="stat-langs">-</strong><div class="small" data-i18n="home.stat.langs"></div></div>
      <div class="card pad-sm"><strong id="stat-symbologies">-</strong><div class="small" data-i18n="home.stat.symbologies"></div></div>
    </div>
  </section>

  <div class="section-head">
    <div><span class="step" data-i18n="home.how.eyebrow"></span><h2 class="mt0" data-i18n="home.how.title"></h2></div>
  </div>
  <div class="grid cols-4">
    <div class="card"><h3 data-i18n="home.how.1.t"></h3><p class="small" data-i18n="home.how.1.d"></p></div>
    <div class="card"><h3 data-i18n="home.how.2.t"></h3><p class="small" data-i18n="home.how.2.d"></p></div>
    <div class="card"><h3 data-i18n="home.how.3.t"></h3><p class="small" data-i18n="home.how.3.d"></p></div>
    <div class="card"><h3 data-i18n="home.how.4.t"></h3><p class="small" data-i18n="home.how.4.d"></p></div>
  </div>

  <div class="section-head">
    <div><span class="step" data-i18n="home.variants.eyebrow"></span><h2 class="mt0" data-i18n="home.variants.title"></h2></div>
    <a class="btn small" href="install.html" data-i18n="home.variants.open"></a>
  </div>
  <div id="app-cards" class="grid cols-3"></div>

  <div class="section-head">
    <div><span class="step" data-i18n="home.hardware.eyebrow"></span><h2 class="mt0" data-i18n="home.hardware.title"></h2></div>
    <div class="row tight">
      <input id="board-filter" type="search" data-i18n-attr="placeholder=home.hardware.filter" style="max-width:220px">
      <select id="board-family" style="max-width:200px"></select>
    </div>
  </div>
  <div id="board-table"></div>

  <div class="section-head">
    <div><span class="step" data-i18n="home.panel.eyebrow"></span><h2 class="mt0" data-i18n="home.panel.title"></h2></div>
  </div>
  <div class="grid cols-3">
    <div class="card">
      <h3 data-i18n="home.panel.wifi.t"></h3>
      <ul class="small">
        <li data-i18n="home.panel.wifi.1"></li>
        <li data-i18n="home.panel.wifi.2"></li>
        <li data-i18n="home.panel.wifi.3"></li>
        <li data-i18n="home.panel.wifi.4"></li>
        <li data-i18n="home.panel.wifi.5"></li>
      </ul>
    </div>
    <div class="card">
      <h3 data-i18n="home.panel.designer.t"></h3>
      <ul class="small">
        <li data-i18n="home.panel.designer.1"></li>
        <li data-i18n="home.panel.designer.2"></li>
        <li data-i18n="home.panel.designer.3"></li>
        <li data-i18n="home.panel.designer.4"></li>
        <li data-i18n="home.panel.designer.5"></li>
      </ul>
    </div>
    <div class="card">
      <h3 data-i18n="home.panel.maint.t"></h3>
      <ul class="small">
        <li data-i18n="home.panel.maint.1"></li>
        <li data-i18n="home.panel.maint.2"></li>
        <li data-i18n="home.panel.maint.3"></li>
        <li data-i18n="home.panel.maint.4"></li>
        <li data-i18n="home.panel.maint.5"></li>
      </ul>
    </div>
  </div>

  <div class="section-head">
    <div><span class="step" data-i18n="home.extras.eyebrow"></span><h2 class="mt0" data-i18n="home.extras.title"></h2></div>
  </div>
  <div class="grid cols-3">
    <div class="card"><h3 data-i18n="home.extras.ops.t"></h3><p class="small" data-i18n="home.extras.ops.d"></p></div>
    <div class="card"><h3 data-i18n="home.extras.compat.t"></h3><p class="small" data-i18n="home.extras.compat.d"></p></div>
    <div class="card"><h3 data-i18n="home.extras.fleet.t"></h3><p class="small" data-i18n="home.extras.fleet.d"></p></div>
  </div>

  <div class="callout info mt3">
    <strong data-i18n="home.browser.t"></strong>
    <span data-i18n="home.browser.d"></span>
  </div>
</main>

<div id="app-footer"></div>
<script type="module" src="assets/js/ui/home.js"></script>
</body>
</html>
