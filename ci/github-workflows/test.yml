name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests + catalog validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # package-lock.json is git-ignored, so `npm ci` can only run once a
      # lockfile exists in the checkout; fall back to `npm install` otherwise.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Run the unit tests
        run: npm test

      - name: Validate the board and application catalogs
        run: npm run validate

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Arsin Print Server - tests"
            echo ""
            echo "| step | command |"
            echo "| --- | --- |"
            echo '| unit tests | `npm test` (node --test test/) |'
            echo '| catalog validation | `npm run validate` |'
            echo ""
            echo "Node: $(node --version)  npm: $(npm --version)"
          } >> "$GITHUB_STEP_SUMMARY"
