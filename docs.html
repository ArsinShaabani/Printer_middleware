<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>Docs &amp; API - Arsin Print Server</title>
<meta name="description" content="Documentation: wiring library, printer language reference, REST API, build instructions, board JSON schema and troubleshooting FAQ.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Crect x='8' y='6' width='16' height='8' rx='2' fill='white'/%3E%3Crect x='6' y='14' width='20' height='9' rx='2' fill='white'/%3E%3Crect x='11' y='21' width='10' height='6' rx='1' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div id="app-header"></div>

<main class="wrap">
  <h1 data-i18n="nav.docs"></h1>
  <p class="lead" data-i18n="docs.lead"></p>

  <div class="tabs" data-group="docs">
    <button data-tab="start" class="active" data-i18n="docs.tab.start"></button>
    <button data-tab="wiring" data-i18n="docs.tab.wiring"></button>
    <button data-tab="languages" data-i18n="docs.tab.languages"></button>
    <button data-tab="api" data-i18n="docs.tab.api"></button>
    <button data-tab="boards" data-i18n="docs.tab.boards"></button>
    <button data-tab="build" data-i18n="docs.tab.build"></button>
    <button data-tab="faq" data-i18n="docs.tab.faq"></button>
  </div>

  <div data-tabpanel="start" data-group="docs">
    <div class="grid cols-2">
      <div class="card">
        <h3 data-i18n="docs.start.1.t"></h3>
        <p class="small" data-i18n-html="docs.start.1.d"></p>
      </div>
      <div class="card">
        <h3 data-i18n="docs.start.2.t"></h3>
        <p class="small" data-i18n-html="docs.start.2.d"></p>
      </div>
      <div class="card">
        <h3 data-i18n="docs.start.3.t"></h3>
        <p class="small" data-i18n-html="docs.start.3.d"></p>
      </div>
      <div class="card">
        <h3 data-i18n="docs.start.4.t"></h3>
        <p class="small" data-i18n-html="docs.start.4.d"></p>
      </div>
    </div>
    <div class="callout info mt2">
      <strong data-i18n="docs.ports.t"></strong> <span data-i18n="docs.ports.d"></span>
    </div>
    <div class="callout ok mt2">
      <strong data-i18n="docs.device.t"></strong>
      <p class="small mb0" data-i18n="docs.device.d"></p>
    </div>
  </div>

  <div data-tabpanel="wiring" data-group="docs" hidden>
    <div class="row mb2">
      <select id="wiring-app" style="max-width:320px"></select>
      <select id="wiring-board" style="max-width:320px"></select>
    </div>
    <div id="wiring-doc"></div>
  </div>

  <div data-tabpanel="languages" data-group="docs" hidden>
    <div id="languages-doc"></div>
  </div>

  <div data-tabpanel="api" data-group="docs" hidden>
    <div id="api-doc"></div>
  </div>

  <div data-tabpanel="boards" data-group="docs" hidden>
    <div id="boards-doc"></div>
  </div>

  <div data-tabpanel="build" data-group="docs" hidden>
    <div id="build-doc"></div>
  </div>

  <div data-tabpanel="faq" data-group="docs" hidden>
    <div id="faq-doc"></div>
  </div>
</main>

<div id="app-footer"></div>
<script type="module" src="assets/js/ui/docs.js"></script>
</body>
</html>
