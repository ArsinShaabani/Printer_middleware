# .github/workflows/ci.yml

name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate catalogs
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Build assets
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          # manifests/ is regenerated by `npm run build`; firmware-bin/ only
          # exists after the firmware compile workflow has run.
          path: |
            manifests/**
            firmware-bin/**
          if-no-files-found: ignore
