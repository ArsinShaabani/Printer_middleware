name: Firmware release

# Compiles every board/variant pair from the catalogs and attaches the binaries
# to a GitHub release whenever a version tag is pushed (v1.2.3, v2.0.0-rc1, ...).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Build the compile matrix from the catalogs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate the board/variant matrix
        id: matrix
        run: |
          cat > "$RUNNER_TEMP/matrix.mjs" <<'JS'
          import { readFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const catalog = await import(pathToFileURL(`${process.cwd()}/assets/js/core/catalog.js`).href);
          const boards = JSON.parse(readFileSync('data/boards.json', 'utf8'));
          const apps = JSON.parse(readFileSync('data/apps.json', 'utf8'));
          const merged = catalog.mergeCatalogs(boards, apps);
          const entries = new Map();
          for (const app of merged.apps) {
            if (app.firmware.env === 'rpi') continue; // Raspberry Pi uses the SD-card installer
            for (const board of merged.boards) {
              if (!board.tool || !board.tool.fqbn) continue;
              if (!catalog.compatibility(board, app).ok) continue;
              const key = `${board.id}|${app.firmware.variant}`;
              if (entries.has(key)) {
                entries.get(key).apps.push(app.id);
                continue;
              }
              entries.set(key, {
                board: board.id,
                family: board.family,
                chipFamily: board.tool.chipFamily,
                fqbn: board.tool.fqbn,
                variant: app.firmware.variant,
                sketch: board.family === 'esp8266' ? 'firmware/arsin_print_server_esp8266' : 'firmware/arsin_print_server',
                apps: [app.id]
              });
            }
          }
          process.stdout.write(JSON.stringify({ include: [...entries.values()] }));
          JS
          node "$RUNNER_TEMP/matrix.mjs" > "$RUNNER_TEMP/matrix.json"
          echo "matrix=$(cat "$RUNNER_TEMP/matrix.json")" >> "$GITHUB_OUTPUT"
          echo "count=$(node -e "console.log(require('$RUNNER_TEMP/matrix.json').include.length)")" >> "$GITHUB_OUTPUT"

  firmware:
    name: Build ${{ matrix.board }} / ${{ matrix.variant }}
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.count != '0' && needs.prepare.outputs.count != '' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the embedded web assets
        run: |
          node tools/build-web-assets.mjs
          node tools/build-web-assets.mjs --min

      - name: Install arduino-cli
        continue-on-error: true
        uses: arduino/setup-arduino-cli@v1

      - name: Install the board cores
        continue-on-error: true
        run: |
          arduino-cli version
          arduino-cli core update-index
          if [ "${{ matrix.family }}" = "esp8266" ]; then
            arduino-cli core install esp8266:esp8266
          else
            arduino-cli core install esp32:esp32
          fi

      - name: Compile ${{ matrix.board }} / ${{ matrix.variant }}
        continue-on-error: true
        run: |
          out="$RUNNER_TEMP/out/${{ matrix.board }}/${{ matrix.variant }}"
          mkdir -p "$out"
          variant_upper="$(echo '${{ matrix.variant }}' | tr '[:lower:]' '[:upper:]')"
          arduino-cli compile \
            --fqbn '${{ matrix.fqbn }}' \
            --export-binaries \
            --output-dir "$out" \
            --build-property "build.extra_flags=-DARSIN_VARIANT_${variant_upper}" \
            '${{ matrix.sketch }}'

      - name: Normalise the binaries
        continue-on-error: true
        run: |
          out="$RUNNER_TEMP/out/${{ matrix.board }}/${{ matrix.variant }}"
          dest="firmware-bin/${{ matrix.board }}/${{ matrix.variant }}"
          mkdir -p "$dest"
          for file in "$out"/*.bin; do
            [ -e "$file" ] || continue
            base="$(basename "$file")"
            case "$base" in
              *.ino.bin) cp "$file" "$dest/firmware.bin" ;;
              *) cp "$file" "$dest/$base" ;;
            esac
          done
          ls -la "$dest"

      - name: Upload the compiled binaries
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}-${{ matrix.variant }}
          path: firmware-bin/${{ matrix.board }}/${{ matrix.variant }}/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish the GitHub release
    needs: [prepare, firmware]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Collect the compiled firmware
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: firmware-bin

      - name: Generate the installer manifests
        run: node tools/generate-manifests.mjs

      - name: Summarise what is being released
        run: |
          {
            echo "## Firmware release ${GITHUB_REF_NAME}"
            echo ""
            echo "| board | variant | binaries |"
            echo "| --- | --- | --- |"
            if [ -d firmware-bin ]; then
              for dir in firmware-bin/*/*; do
                [ -d "$dir" ] || continue
                board="$(basename "$(dirname "$dir")")"
                variant="$(basename "$dir")"
                count="$(find "$dir" -name '*.bin' | wc -l | tr -d ' ')"
                echo "| $board | $variant | $count |"
              done
            fi
            echo ""
            echo "Manifests: \`$(node -e "const i=require('./manifests/index.json');console.log(i.builds.length+' builds, '+i.builds.filter(b=>b.available).length+' available')")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: Arsin Print Server ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            Firmware binaries and esp-web-tools manifests for ${{ github.ref_name }}.

            Every binary is built from `data/boards.json` + `data/apps.json`; the
            `firmware-bin/<board>/<variant>/` layout matches the manifests published
            with the site, so the browser installer can flash them directly.

            Flash from the installer, or build locally with the commands shown in the
            "Manual build" section of each board page.
          files: |
            firmware-bin/**/*.bin
            manifests/**/*.json

